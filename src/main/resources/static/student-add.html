<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Admission</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #2563eb;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <div class="header">
        <h1>Zenith Computer Academy</h1>
        <p>Student Admission Form</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Student Admission</h2>

            <div class="section-title">
                Personal Information
            </div>

            <div class="grid">

                <div>
                    <label>Name *</label>
                    <input type="text" id="name">
                </div>

                <div>
                    <label>Date of Birth</label>
                    <input type="date" id="dob">
                </div>
                <div>
                    <label>Admission Date</label>
                    <input type="date" id="admissionDate">
                </div>
                <div>
                    <label>Gender</label>
                    <select id="gender">
                        <option value="">Select</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>

            </div>

            <div class="section-title">
                Parent / Guardian Information
            </div>

            <div class="grid">

                <div>
                    <label>Father Name</label>
                    <input type="text" id="fatherName">
                </div>

                <div>
                    <label>Mother Name</label>
                    <input type="text" id="motherName">
                </div>

                <div>
                    <label>Guardian Name</label>
                    <input type="text" id="gurdianName">
                </div>

                <div>
                    <label>Guardian Relation</label>
                    <input type="text" id="gurdianRelation">
                </div>

            </div>

            <div class="section-title">
                Contact Information
            </div>

            <div class="grid">

                <div>
                    <label>WhatsApp Number</label>
                    <input type="text" id="whatsappNumber">
                </div>

                <div>
                    <label>School</label>
                    <input type="text" id="school">
                </div>

                <div>
                    <label>Class</label>
                    <input type="text" id="studentClass">
                </div>

                <div>
                    <label>Course</label>
                    <select id="courseId">
                        <option value="">Loading...</option>
                    </select>
                </div>

                <div class="full">
                    <label>Address</label>
                    <textarea id="address"></textarea>
                </div>

            </div>

            <div class="section-title">
                Student Note
            </div>

            <div class="grid">

                <div class="full">
                    <label>Note</label>

                    <textarea id="note" placeholder="Timing, Days, Batch, Remarks etc"></textarea>
                </div>

            </div>

            <div class="section-title">
                Fee Information
            </div>

            <div class="grid">

                <div>
                    <label>Course Fees</label>
                    <input type="number" id="fees">
                </div>

                <div>
                    <label>Status</label>
                    <select id="status">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="COMPLETED">COMPLETED</option>
                    </select>
                </div>

            </div>

            <button onclick="saveStudent()">
                Save Student
            </button>

            <div id="message" class="message"></div>

        </div>

    </div>

    <script>

        const COURSE_API = "/api/course";
        const STUDENT_API = "/api/student";

        async function loadCourses() {
            try {

                const response =
                    await fetch(COURSE_API);

                const courses =
                    await response.json();

                let options =
                    '<option value="">Select Course</option>';

                courses.forEach(course => {

                    options += `
                <option value="${course.id}">
                    ${course.courseName}
                </option>
            `;

                });

                document.getElementById("courseId")
                    .innerHTML = options;

            }
            catch (error) {

                console.error(error);

            }
        }

        async function saveStudent() {
            const name =
                document.getElementById("name").value;

            if (name.trim() === "") {
                showMessage(
                    "Name is required",
                    false
                );
                return;
            }



            const student = {

                name: name,

                dob:
                    document.getElementById("dob").value || null,

                admissionDate:
                    document.getElementById(
                        "admissionDate"
                    ).value || null,

                gender:
                    document.getElementById("gender").value || null,

                fatherName:
                    document.getElementById("fatherName").value,

                motherName:
                    document.getElementById("motherName").value,

                gurdianName:
                    document.getElementById("gurdianName").value,

                gurdianRelation:
                    document.getElementById("gurdianRelation").value,

                whatsappNumber:
                    document.getElementById("whatsappNumber").value,

                address:
                    document.getElementById("address").value,

                school:
                    document.getElementById("school").value,

                studentClass:
                    document.getElementById("studentClass").value,

                note:
                    document.getElementById("note").value,

                fees:
                    parseFloat(
                        document.getElementById("fees").value || 0
                    ),

                status:
                    document.getElementById("status").value,

                courseId:
                    document.getElementById("courseId").value
            };

            try {

                const response =
                    await fetch(STUDENT_API, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body:
                            JSON.stringify(student)

                    });

                if (response.ok) {
                    document
                        .querySelectorAll("input, textarea")
                        .forEach(x => x.value = "");

                    showMessage(
                        "Student added successfully",
                        true
                    );
                }
                else {
                    showMessage(
                        "Failed to save student",
                        false
                    );
                }

            }
            catch (error) {

                console.error(error);

                showMessage(
                    "Server Error",
                    false
                );

            }
        }

        function showMessage(msg, success) {
            const div =
                document.getElementById("message");

            div.style.display = "block";

            div.className =
                success
                    ? "message success"
                    : "message error";

            div.innerText = msg;
        }

        loadCourses();

    </script>

</body>

</html>
