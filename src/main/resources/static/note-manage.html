<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Manage Notes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.section-title{
    margin:20px 0;
    font-size:22px;
    font-weight:bold;
}

.note-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.note-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.pending{
    border-left:6px solid #dc2626;
}

.completed{
    border-left:6px solid #16a34a;
}

.note-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.note-date{
    color:#666;
    margin-bottom:10px;
}

.note-text{
    margin-bottom:15px;
    white-space:pre-wrap;
}

.btn{
    border:none;
    padding:10px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    margin-right:5px;
}

.complete-btn{
    background:#16a34a;
}

.delete-btn{
    background:#dc2626;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    font-size:13px;
    margin-bottom:10px;
}

.pending-status{
    background:#dc2626;
}

.completed-status{
    background:#16a34a;
}

</style>
</head>

<body>

<div class="header">
    <h1>Zenith Computer Academy</h1>
    <p>Notes Management</p>
</div>

<div class="container">

<div class="section-title">
Pending Notes
</div>

<div id="pendingContainer"
     class="note-grid">
</div>

<div class="section-title">
Completed Notes
</div>

<div id="completedContainer"
     class="note-grid">
</div>

</div>

<script>

const API="/api/note";

async function loadNotes()
{
    const response=
        await fetch(API);

    const notes=
        await response.json();

    renderNotes(notes);
}

function renderNotes(notes)
{
    let pendingHtml="";
    let completedHtml="";

    notes.forEach(note=>{

        const card=`
        <div class="note-card ${
            note.status==="COMPLETED"
            ? "completed"
            : "pending"
        }">

            <div class="status ${
                note.status==="COMPLETED"
                ? "completed-status"
                : "pending-status"
            }">

                ${note.status}

            </div>

            <div class="note-title">
                ${note.title}
            </div>

            <div class="note-date">
                Due :
                ${formatDate(note.dueDate)}
            </div>

            <div class="note-text">
                ${note.noteText || ""}
            </div>

            ${
                note.status==="PENDING"
                ?
                `
                <button
                    class="btn complete-btn"
                    onclick="markComplete(${note.noteId})">
                    Complete
                </button>
                `
                :
                ""
            }

            <button
                class="btn delete-btn"
                onclick="deleteNote(${note.noteId})">
                Delete
            </button>

        </div>
        `;

        if(note.status==="COMPLETED")
            completedHtml+=card;
        else
            pendingHtml+=card;
    });

    document.getElementById(
        "pendingContainer"
    ).innerHTML=pendingHtml;

    document.getElementById(
        "completedContainer"
    ).innerHTML=completedHtml;
}

function formatDate(date)
{
    if(!date)
        return "-";

    return date.substring(0,10);
}

async function markComplete(id)
{
    await fetch(
        API+"/complete/"+id,
        {
            method:"PUT"
        }
    );

    loadNotes();
}

async function deleteNote(id)
{
    if(!confirm("Delete Note?"))
        return;

    await fetch(
        API+"/"+id,
        {
            method:"DELETE"
        }
    );

    loadNotes();
}

loadNotes();

</script>

</body>
</html>
