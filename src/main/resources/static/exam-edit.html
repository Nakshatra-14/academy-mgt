<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Exam</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.loading{
    text-align:center;
    padding:30px;
    color:#666;
}

.exam-id{
    background:#eff6ff;
    color:#2563eb;
    padding:10px;
    border-radius:8px;
    margin-bottom:20px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="header">
    <h1>Zenith Computer Academy</h1>
    <p>Edit Exam</p>
</div>

<div class="container">

    <div class="card">

        <div id="loading" class="loading">
            Loading Exam...
        </div>

        <div id="formSection" style="display:none;">

            <div class="exam-id" id="examIdDisplay">
            </div>

            <div class="form-group">
                <label>Exam Name</label>

                <input
                    type="text"
                    id="examName">
            </div>

            <div class="form-group">
                <label>Course</label>

                <select id="courseId">
                </select>
            </div>

            <div class="form-group">
                <label>Total Marks</label>

                <input
                    type="number"
                    id="totalMarks">
            </div>

            <div class="form-group">
                <label>Exam Date</label>

                <input
                    type="date"
                    id="examDate">
            </div>

            <button onclick="updateExam()">
                Update Exam
            </button>

            <div
                id="message"
                class="message">
            </div>

        </div>

    </div>

</div>

<script>

const EXAM_API="/api/exam";
const COURSE_API="/api/course";

const params=
    new URLSearchParams(
        window.location.search
    );

const examId=
    params.get("id");

let allCourses=[];

async function init()
{
    await loadCourses();
    await loadExam();
}

async function loadCourses()
{
    try
    {
        const response=
            await fetch(COURSE_API);

        allCourses=
            await response.json();

        const dropdown=
            document.getElementById(
                "courseId"
            );

        dropdown.innerHTML="";

        allCourses.forEach(course=>{

            dropdown.innerHTML+=
            `
            <option value="${course.id}">
                ${course.courseName}
                (${course.id})
            </option>
            `;
        });
    }
    catch(error)
    {
        console.error(error);
    }
}

async function loadExam()
{
    try
    {
        const response=
            await fetch(
                EXAM_API+
                "/"+
                examId
            );

        if(!response.ok)
        {
            throw new Error(
                "Exam Not Found"
            );
        }

        const exam=
            await response.json();

        document.getElementById(
            "examIdDisplay"
        ).innerHTML=
        "Exam ID : " +
        exam.examId;

        document.getElementById(
            "examName"
        ).value=
        exam.examName;

        document.getElementById(
            "courseId"
        ).value=
        exam.courseId;

        document.getElementById(
            "totalMarks"
        ).value=
        exam.totalMarks;

        if(exam.examDate)
        {
            const date=
                new Date(
                    exam.examDate
                );

            const formatted=
                date.toISOString()
                    .split("T")[0];

            document.getElementById(
                "examDate"
            ).value=
            formatted;
        }

        document.getElementById(
            "loading"
        ).style.display=
        "none";

        document.getElementById(
            "formSection"
        ).style.display=
        "block";
    }
    catch(error)
    {
        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML=
        "Failed To Load Exam";
    }
}

async function updateExam()
{
    const examName=
        document.getElementById(
            "examName"
        ).value.trim();

    const courseId=
        document.getElementById(
            "courseId"
        ).value;

    const totalMarks=
        document.getElementById(
            "totalMarks"
        ).value;

    const examDate=
        document.getElementById(
            "examDate"
        ).value;

    if(
        examName==="" ||
        courseId==="" ||
        totalMarks==="" ||
        examDate==="")
    {
        showMessage(
            "Please fill all fields",
            false
        );
        return;
    }

    const payload=
    {
        examName:
            examName,

        courseId:
            courseId,

        totalMarks:
            parseInt(totalMarks),

        examDate:
            examDate
    };

    try
    {
        const response=
            await fetch(
                EXAM_API+
                "/"+
                examId,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );

        if(response.ok)
        {
            showMessage(
                "Exam Updated Successfully",
                true
            );
        }
        else
        {
            showMessage(
                "Failed To Update Exam",
                false
            );
        }
    }
    catch(error)
    {
        console.error(error);

        showMessage(
            "Server Error",
            false
        );
    }
}

function showMessage(
    message,
    success
)
{
    const msg=
        document.getElementById(
            "message"
        );

    msg.innerHTML=
        message;

    msg.className=
        success
        ?
        "message success"
        :
        "message error";
}

init();

</script>

</body>
</html>
