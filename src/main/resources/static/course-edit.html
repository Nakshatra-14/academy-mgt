<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Course</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#1f2937;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    border:none;
    padding:12px;
    border-radius:8px;
    color:white;
    cursor:pointer;
    font-size:15px;
}

.save-btn{
    background:#2563eb;
}

.save-btn:hover{
    background:#1d4ed8;
}

.back-btn{
    background:#6b7280;
}

.back-btn:hover{
    background:#4b5563;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.course-id{
    color:#2563eb;
    font-weight:bold;
    margin-bottom:20px;
}

</style>
</head>
<body>

<div class="header">
    <h1>Zenith Computer Academy</h1>
    <p>Edit Course</p>
</div>

<div class="container">

    <div class="card">

        <h2>Edit Course</h2>

        <div
            id="courseIdDisplay"
            class="course-id">
            Loading...
        </div>

        <div class="form-group">

            <label>
                Course Name
            </label>

            <input
                type="text"
                id="courseName">

        </div>

        <div class="button-row">

            <button
                class="btn save-btn"
                onclick="updateCourse()">

                Update Course

            </button>

            <button
                class="btn back-btn"
                onclick="window.location='course.html'">

                Back

            </button>

        </div>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>

<script>

const API="/api/course";

const params=
    new URLSearchParams(
        window.location.search
    );

const courseId=
    params.get("id");

let currentCourse=null;

async function loadCourse()
{
    try
    {
        const response=
            await fetch(
                API+"/"+courseId
            );

        if(!response.ok)
        {
            showMessage(
                "Course not found",
                false
            );
            return;
        }

        currentCourse=
            await response.json();

        document.getElementById(
            "courseIdDisplay"
        ).innerText=
            "Course ID : "
            + currentCourse.id;

        document.getElementById(
            "courseName"
        ).value=
            currentCourse.courseName || "";
    }
    catch(error)
    {
        console.error(error);

        showMessage(
            "Failed to load course",
            false
        );
    }
}

async function updateCourse()
{
    const courseName=
        document.getElementById(
            "courseName"
        ).value;

    if(courseName.trim()==="")
    {
        showMessage(
            "Course name required",
            false
        );
        return;
    }

    try
    {
        const response=
            await fetch(
                API+"/"+courseId,
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({
                        courseName:
                        courseName
                    })
                }
            );

        if(response.ok)
        {
            showMessage(
                "Course Updated Successfully",
                true
            );

            setTimeout(() => {

                window.location=
                    "course.html";

            },1000);
        }
        else
        {
            showMessage(
                "Update Failed",
                false
            );
        }
    }
    catch(error)
    {
        console.error(error);

        showMessage(
            "Server Error",
            false
        );
    }
}

function showMessage(
    msg,
    success
)
{
    const div=
        document.getElementById(
            "message"
        );

    div.style.display=
        "block";

    div.className=
        success
        ? "message success"
        : "message error";

    div.innerText=msg;
}

loadCourse();

</script>

</body>
</html>
