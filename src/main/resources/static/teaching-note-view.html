<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>View Note</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.note{
    white-space:pre-wrap;
    line-height:1.6;
}

.back-btn{
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
    <h1>Teaching Note</h1>
</div>

<div class="container">

    <div class="card">

        <div
            id="title"
            class="title">
        </div>

        <div
            id="note"
            class="note">
        </div>

        <button
            class="back-btn"
            onclick="history.back()">

            Back

        </button>

    </div>

</div>

<script>

const API="/api/teaching-note";

const params=
    new URLSearchParams(
        window.location.search
    );

const id=
    params.get("id");

async function loadNote()
{
    const response=
        await fetch(
            API+"/"+id
        );

    const note=
        await response.json();

    document.getElementById(
        "title"
    ).innerText=
        note.title;

    document.getElementById(
        "note"
    ).innerText=
        note.note || "";
}

loadNote();

</script>

</body>
</html>
