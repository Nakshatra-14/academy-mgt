<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Note</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#1f2937;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

textarea{
    min-height:120px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>
</head>

<body>

<div class="header">
    <h1>Zenith Computer Academy</h1>
    <p>Add Note</p>
</div>

<div class="container">

<div class="card">

<div class="form-group">
<label>Title</label>
<input type="text" id="title">
</div>

<div class="form-group">
<label>Due Date</label>
<input type="date" id="dueDate">
</div>

<div class="form-group">
<label>Note</label>
<textarea id="noteText"></textarea>
</div>

<button onclick="saveNote()">
Save Note
</button>

<div id="message" class="message"></div>

</div>

</div>

<script>

const API="/api/note";

async function saveNote()
{
    const payload={
        title:
        document.getElementById("title").value,

        dueDate:
        document.getElementById("dueDate").value,

        noteText:
        document.getElementById("noteText").value,

        status:"PENDING"
    };

    const response=
        await fetch(API,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(payload)
        });

    const msg=
        document.getElementById("message");

    if(response.ok)
    {
        msg.innerHTML="Note Saved";
        msg.className="message success";

        document.getElementById("title").value="";
        document.getElementById("dueDate").value="";
        document.getElementById("noteText").value="";
    }
    else
    {
        msg.innerHTML="Failed";
        msg.className="message error";
    }
}

</script>

</body>
</html>
